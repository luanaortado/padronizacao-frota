function mapHTML(){

 return `<div class="map-shell"><svg class="map-svg" viewBox="0 0 780 687" aria-label="Mapa do Brasil com frota ativa por estado"><image class="map-base" href="${MAP_IMAGE}" x="0" y="0" width="780" height="687" preserveAspectRatio="xMidYMid meet"></image>${nodes}</svg><div class="map-scale">Menor frota <div class="scale-line"></div> Maior frota</div></div>`

 <div class="section"><div class="grid g3"><div class="card"><div class="card-head"><div><h3>Pipeline técnico</h3><p>131 veículos no Kanban</p></div></div>${availabilityDonut()}</div><div class="card span2 flush"><div style="padding:18px 18px 8px"><div class="card-head"><div><h3>Inventário combinado por modelo</h3><p>Ativos + Stand By + liberações previstas</p></div></div></div><div class="table-wrap short"><table><thead><tr><th>Modelo</th><th class="num">Ativos</th><th class="num">Stand By</th><th class="num">Em breve</th><th class="num">Projetado</th></tr></thead><tbody>${managedRows.map(r=>`<tr><td><span class="pill">${r.model}</span></td><td class="num">${r.active}</td><td class="num green">${r.immediate}</td><td class="num blue">${r.soon}</td><td class="num teal">${r.projected}</td></tr>`).join('')}</tbody></table></div></div></div></div>
 <div class="note"><b>Sequência de implantação:</b> 1) separar os 21 veículos que já formam a reserva mínima imediata; 2) usar o restante do Stand By em trocas casadas, priorizando Centro-Oeste e Sul; 3) concluir os 22 remanejamentos e completar as 4 reservas faltantes conforme o pipeline liberar. <b>B88 e BR*</b> estão consolidados como BR8, <b>S1</b> como S10 e “S9X VIPS” como S9X.</div><div class="footer">Fontes: Mapeamento Modelos–UF.xlsx · <a href="https://matheus-machado-da-silva.github.io/Kanban/" target="_blank" rel="noopener" style="color:var(--teal)">Kanban BRMobility</a>, leitura em 21/08/2026 · Premissas de reserva e redistribuição: elaboração BRMobility</div>`;
}
function postsDonut(){const sp=REGIONAL_BASE.SP.posts/POST_TOTAL,rj=REGIONAL_BASE.RJ.posts/POST_TOTAL,a1=sp*360,a2=(sp+rj)*360;return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--teal) 0 ${a1}deg,var(--blue) ${a1}deg ${a2}deg,#273247 ${a2}deg 360deg)"><div class="donut-center"><strong>${POST_TOTAL}</strong><span>postos</span></div></div><div class="donut-legend"><div><i style="background:var(--teal)"></i>SP · ${REGIONAL_BASE.SP.posts} · ${pct(sp)}</div><div><i style="background:var(--blue)"></i>RJ · ${REGIONAL_BASE.RJ.posts} · ${pct(rj)}</div><div><i style="background:#273247"></i>Demais · ${POST_TOTAL-REGIONAL_BASE.SP.posts-REGIONAL_BASE.RJ.posts} · ${pct(1-sp-rj)}</div></div></div>`}
function regionalPostsTable(rows){const posts=rows.reduce((s,r)=>s+r.posts,0),vehicles=rows.reduce((s,r)=>s+r.vehicles,0),cost=rows.reduce((s,r)=>s+r.cost,0);return `<table><thead><tr><th>#</th><th>UF</th><th>Responsável(is)</th><th class="num">Postos</th><th class="num">% postos</th><th class="num">Veículos ativos</th><th class="num">% frota</th><th class="num">R$/posto</th><th class="num">Custo total/mês</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td><span class="pill">${r.uf}</span></td><td>${REPS[r.uf].map(n=>n==='Não informado'?`<span class="empty">${n}</span>`:`<span class="pill rep-pill">${n}</span>`).join(' ')}</td><td class="num">${r.posts}</td><td class="num">${pct(r.posts/POST_TOTAL)}</td><td class="num">${r.vehicles}</td><td class="num">${pct(r.vehicles/CURRENT_ACTIVE_TOTAL)}</td><td class="num">${r.uf==='RJ'||r.uf==='SP'?'—':brl(POST_COST)}</td><td class="num ${r.uf==='SP'?'green':'teal'}">${r.uf==='SP'?'Absorvido':brl(r.cost)}</td></tr>`).join('')}</tbody><tfoot><tr><td></td><td><b>Total exibido</b></td><td></td><td class="num">${posts}</td><td class="num">${pct(posts/POST_TOTAL)}</td><td class="num">${vehicles}</td><td class="num">${pct(vehicles/CURRENT_ACTIVE_TOTAL)}</td><td class="num">—</td><td class="num teal">${brl(cost)}</td></tr></tfoot></table>`}
function filterPostsRegional(uf){document.getElementById('regional-table').innerHTML=regionalPostsTable(uf==='ALL'?regionalRows:regionalRows.filter(r=>r.uf===uf))}
function renderPostosRegional(){
 document.getElementById('top-title').textContent='Postos por Regional (UF)';
 document.getElementById('main').innerHTML=hero('Postos por regional (UF)','Cobertura comercial e técnica medida por posto, com a frota ativa apresentada como indicador adicional de capacidade e concentração.')+
 `<div class="grid g4">${kpi('Postos atendidos',fmt(POST_TOTAL),'base operacional atual · 19 UFs','teal')}${kpi('Frota ativa',fmt(CURRENT_ACTIVE_TOTAL),'veículos ativos em contratos','blue')}${kpi('Custo padrão',brl(POST_COST),'por posto · exceto SP e RJ','purple')}${kpi('Custo mensal modelado',brl(REGIONAL_TOTAL_COST),'SP absorvido · RJ fixo em R$ 3 mil','orange')}</div>
 <div class="section"><div class="section-title"><h2>Modelo de remuneração do projeto</h2><span>Relacionamento técnico e conversão comercial</span></div><div class="grid g2"><div class="card" style="border-top:3px solid var(--teal)"><div style="display:flex;gap:18px;align-items:center"><div class="kpi-val teal" style="margin:0">50%</div><div><h3 style="font-size:14px">Visita de relacionamento</h3><p style="font-size:10px;color:var(--muted2);line-height:1.6;margin-top:5px">Remuneração equivalente a 50% do valor do atendimento técnico, com faixa esperada entre <b style="color:var(--text)">R$ 75 e R$ 90 por visita qualificada</b>.</p></div></div></div><div class="card" style="border-top:3px solid var(--blue)"><div style="display:flex;gap:18px;align-items:center"><div class="kpi-val blue" style="margin:0">50%</div><div><h3 style="font-size:14px">Conversão comercial</h3><p style="font-size:10px;color:var(--muted2);line-height:1.6;margin-top:5px">Remuneração de 50% do valor mensal do contrato convertido, paga <b style="color:var(--text)">após o faturamento do primeiro mês completo</b>.</p></div></div></div></div></div>
 <div class="section"><div class="grid g3"><div class="card span2"><div class="card-head"><div><h3>Cobertura e custo por UF</h3><p>Ordenação pela quantidade de postos · veículos exibidos como informação complementar</p></div><select class="filter" id="uf-filter" onchange="filterPostsRegional(this.value)"><option value="ALL">Todas as UFs</option>${regionalRows.map(r=>`<option>${r.uf}</option>`).join('')}</select></div><div class="table-wrap" id="regional-table">${regionalPostsTable(regionalRows)}</div><div class="note"><b>RJ:</b> custo mensal total fixado em <b>R$ 3.000,00</b>, sem cálculo de valor por posto, devido a uma negociação diferenciada. <b>SP:</b> estrutura já absorvida, sem custo incremental.</div></div><div class="card"><div class="card-head"><div><h3>Concentração dos postos</h3><p>SP, RJ e demais UFs</p></div></div>${postsDonut()}<div style="margin-top:8px">${barList(regionalRows.slice(0,8),'uf','posts',regionalRows[0].posts,'teal')}</div></div></div></div>
 <div class="section"><div class="section-title"><h2>Responsáveis por território</h2><span>Postos e veículos ativos sob cobertura</span></div><div class="grid g3">${regionalRows.map(r=>`<div class="card" style="padding:13px 15px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><span class="pill">${r.uf}</span><div style="font-weight:700;margin-top:8px;font-size:12px">${REPS[r.uf].map(n=>n==='Não informado'?`<span class="empty">${n}</span>`:n).join(' · ')}</div></div><div style="text-align:right"><div class="teal" style="font-size:20px;font-weight:800">${r.posts}</div><div style="font-size:9px;color:var(--muted)">postos · ${r.vehicles} veículos</div></div></div></div>`).join('')}</div></div>
 <div class="note"><b>Premissas de custeio:</b> o custo padrão é de R$ 75,00 por posto atendido. A quantidade de veículos não multiplica o custo; ela aparece apenas como indicador da frota ativa em contrato. O RJ possui valor total negociado de R$ 3.000,00 e SP permanece sem custo incremental.</div><div class="footer">Fonte: quadro atualizado de postos e veículos por UF fornecido em 25/08/2026 · Relação de ATs fornecida · Elaboração BRMobility</div>`;
}
function renderFase1(){
 document.getElementById('top-title').textContent='Projeto Regionais | Fase 1';
 const standard=phase1Rows.filter(r=>r.costType==='Por visita'),standardPosts=standard.reduce((s,r)=>s+r.postCount,0),standardVehicles=standard.reduce((s,r)=>s+r.vehicles,0),leonardo=phase1Rows.find(r=>r.name==='Leonardo Nogueira');
 document.getElementById('main').innerHTML=hero('Projeto de regionais — Fase 1','Detalhamento dos responsáveis aptos a iniciar o projeto, com estados atendidos, postos sob cobertura, frota instalada e modelo de custo.')+
 `<div class="grid g4">${kpi('Responsáveis aptos',fmt(phase1Rows.length),'6 no modelo por visita + Leonardo','teal')}${kpi('Postos mapeados',fmt(PHASE1_POSTS),'base operacional da planilha','blue')}${kpi('Veículos nos postos',fmt(PHASE1_VEHICLES),'frota vinculada aos postos da Fase 1','purple')}${kpi('Ciclo padrão de visitas',brl(PHASE1_STANDARD_COST),'1 visita nos '+standardPosts+' postos do modelo variável','orange')}</div>
 <div class="section"><div class="grid g2"><div class="card" style="border-top:3px solid var(--teal)"><div class="card-head"><div><h3>Modelo por visita</h3><p>Tiago GO/DF, Gaspar, Tarcisio, Alexandre, Janderson e Tiago PE</p></div></div><div style="display:flex;gap:28px;align-items:flex-end"><div><div class="kpi-val teal" style="margin:0">${standardPosts}</div><div class="kpi-sub">postos · ${standardVehicles} veículos</div></div><div><div class="kpi-val" style="font-size:22px;margin:0">${brl(PHASE1_STANDARD_COST)}</div><div class="kpi-sub">custo de um ciclo completo</div></div></div></div><div class="card" style="border-top:3px solid var(--blue)"><div class="card-head"><div><h3>Leonardo Nogueira · RJ</h3><p>Modelo de negociação diferenciada</p></div></div><div style="display:flex;gap:28px;align-items:flex-end"><div><div class="kpi-val blue" style="margin:0">${brl(leonardo.cost)}</div><div class="kpi-sub">custo mensal fixo</div></div><div><div class="kpi-val" style="font-size:22px;margin:0">${leonardo.postCount}</div><div class="kpi-sub">postos · ${leonardo.vehicles} veículos</div></div></div></div></div></div>
 <div class="section"><div class="section-title"><h2>Responsáveis e postos atendidos</h2><span>Clique em um responsável para abrir a relação de postos</span></div><div class="phase-list">${phase1Rows.map((r,i)=>`<details class="phase-item" ${i===0?'open':''}><summary class="phase-summary"><div><div class="phase-name">${r.label}</div><div class="phase-meta">${r.ufs.map(uf=>`<span class="pill" style="margin-right:4px">${uf}</span>`).join('')} · ${r.costType}</div></div><div class="phase-metric"><b>${r.postCount} postos · ${r.vehicles} veículos</b>Cobertura operacional</div><div class="phase-metric"><b>${brl(r.cost)}${r.costType==='Por visita'?' / visita':' / mês'}</b>${r.costType==='Por visita'?`Ciclo completo: ${brl(r.cycleCost)}`:'Negociação diferenciada'}</div><div class="phase-chevron">⌄</div></summary><div class="phase-body"><div class="table-wrap"><table><thead><tr><th>#</th><th>UF</th><th>Posto</th><th class="num">Veículos</th><th class="num">% da frota do responsável</th></tr></thead><tbody>${r.posts.map((p,j)=>`<tr><td class="rank">${j+1}</td><td><span class="pill">${p.uf}</span></td><td>${p.name}</td><td class="num">${p.vehicles}</td><td class="num">${pct(p.vehicles/r.vehicles)}</td></tr>`).join('')}</tbody><tfoot><tr><td></td><td></td><td><b>Total</b></td><td class="num">${r.vehicles}</td><td class="num">100,0%</td></tr></tfoot></table></div></div></details>`).join('')}</div></div>
 <div class="note"><b>Leitura da Fase 1:</b> os seis responsáveis do modelo variável cobrem ${standardPosts} postos e ${standardVehicles} veículos. O custo de ${brl(PHASE1_STANDARD_COST)} representa um ciclo com uma visita em cada posto; recorrência e agenda ainda devem ser definidas. Leonardo Nogueira permanece no modelo mensal fixo de ${brl(leonardo.cost)}. Esta aba usa diretamente a planilha “Gestão Operacional de Contratos”, cujo recorte do RJ contém ${leonardo.postCount} postos e ${leonardo.vehicles} veículos e pode diferir da fotografia consolidada da aba Postos por Regional.</div><div class="footer">Fonte: Gestão Operacional de Contratos.xlsx · Valores de remuneração informados pela BRMobility · Elaboração BRMobility</div>`;
}
function renderRegional(){
 document.getElementById('top-title').textContent='Veículos por Regional (UF)';
 const sp=ufRows.find(r=>r.uf==='SP'), national=(TOTAL-sp.total)*COST;
 document.getElementById('main').innerHTML=hero('Veículos por regional (UF)','Cobertura comercial, representatividade da frota e custo mensal equivalente por posto e por estado.')+
 `<div class="grid g4">${kpi('Postos atendidos',fmt(TOTAL),'1 veículo ativo = 1 posto para custeio','teal')}${kpi('Custo por posto',brl(COST),'referência RJ: R$ 3 mil ÷ 49','blue')}${kpi('Custo incremental mapeado',brl(national),'estimativa mensal sem SP','purple')}${kpi('SP · custo adicional','Absorvido','143 postos · sem custo incremental','green')}</div>
 <div class="section"><div class="cost-callout"><div class="cost-formula">R$ 3.000 ÷ 49 = <b>${brl(COST)}</b></div><div class="cost-note">Custo unitário mensal aplicado proporcionalmente às UFs. São Paulo fica fora deste cálculo: sua estrutura mensal de R$ 8 mil já está absorvida e não gera custo adicional.</div></div></div>
 <div class="section"><div class="grid g3">
  <div class="card span2"><div class="card-head"><div><h3>Cobertura e custo por UF</h3><p>Ordenado pela quantidade de postos atendidos</p></div><select class="filter" id="uf-filter" onchange="filterRegional(this.value)"><option value="ALL">Todas as UFs</option>${ufRows.map(r=>`<option>${r.uf}</option>`).join('')}</select></div><div class="table-wrap" id="regional-table">${regionalTable(ufRows)}</div></div>
  <div class="card"><div class="card-head"><div><h3>Concentração da frota</h3><p>SP, RJ e demais UFs</p></div></div>${donut()}<div style="margin-top:8px">${barList(ufRows.slice(0,8),'uf','total',sp.total,'teal')}</div></div>
 </div></div>
 <div class="section"><div class="section-title"><h2>Responsáveis por território</h2><span>Conforme relação de ATs fornecida</span></div><div class="grid g3">${ufRows.map(r=>`<div class="card" style="padding:13px 15px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><span class="pill">${r.uf}</span><div style="font-weight:700;margin-top:8px;font-size:12px">${REPS[r.uf].map(n=>n==='Não informado'?`<span class="empty">${n}</span>`:n).join(' · ')}</div></div><div style="text-align:right"><div class="teal" style="font-size:20px;font-weight:800">${r.total}</div><div style="font-size:9px;color:var(--muted)">postos</div></div></div></div>`).join('')}</div></div>
 <div class="note"><b>Premissa de custeio:</b> a referência informada associa o custo mensal do RJ (R$ 3.000) aos 49 registros de veículos da base. Por consistência, “posto” é tratado neste painel como um veículo ativo atendido. O custo por UF é uma estimativa proporcional, não uma despesa contábil realizada. <b>SP foi excluído do custo incremental</b>, pois sua estrutura mensal de R$ 8 mil já está absorvida; o responsável permanece BRMobility.</div><div class="footer">Fonte: Mapeamento Modelos–UF.xlsx e relação de ATs fornecida · Elaboração BRMobility</div>`;
}
function regionalTable(rows){const posts=rows.reduce((s,r)=>s+r.total,0),incremental=rows.filter(r=>r.uf!=='SP').reduce((s,r)=>s+r.total*COST,0);return `<table><thead><tr><th>#</th><th>UF</th><th>Responsável(is)</th><th class="num">Postos</th><th class="num">% frota</th><th class="num">R$/posto</th><th class="num">Custo incremental/mês</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td><span class="pill">${r.uf}</span></td><td>${REPS[r.uf].map(n=>n==='Não informado'?`<span class="empty">${n}</span>`:`<span class="pill rep-pill">${n}</span>`).join(' ')}</td><td class="num">${r.total}</td><td class="num">${pct(r.total/TOTAL)}</td><td class="num">${r.uf==='SP'?'—':brl(COST)}</td><td class="num ${r.uf==='SP'?'green':'teal'}">${r.uf==='SP'?'Absorvido':brl(r.total*COST)}</td></tr>`).join('')}</tbody><tfoot><tr><td></td><td><b>Total exibido</b></td><td></td><td class="num">${posts}</td><td class="num">${pct(posts/TOTAL)}</td><td class="num">—</td><td class="num teal">${brl(incremental)}</td></tr></tfoot></table>`}
function filterRegional(uf){const rows=uf==='ALL'?ufRows:ufRows.filter(r=>r.uf===uf);document.getElementById('regional-table').innerHTML=regionalTable(rows)}
function donut(){const sp=143/TOTAL,rj=49/TOTAL;const a1=sp*360,a2=(sp+rj)*360;return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--teal) 0 ${a1}deg,var(--blue) ${a1}deg ${a2}deg,#273247 ${a2}deg 360deg)"><div class="donut-center"><strong>${TOTAL}</strong><span>veículos</span></div></div><div class="donut-legend"><div><i style="background:var(--teal)"></i>SP · ${pct(sp)}</div><div><i style="background:var(--blue)"></i>RJ · ${pct(rj)}</div><div><i style="background:#273247"></i>Demais · ${pct(1-sp-rj)}</div></div></div>`}
function downloadCSV(){const page=document.querySelector('.nav-btn.active').dataset.page;let rows,name;if(page==='regional'){rows=[['UF','Responsáveis','Postos','% Postos','Veículos ativos','% Frota','R$/posto','Custo total/mês'],...regionalRows.map(r=>[r.uf,REPS[r.uf].join(' / '),r.posts,(r.posts/POST_TOTAL*100).toFixed(2),r.vehicles,(r.vehicles/CURRENT_ACTIVE_TOTAL*100).toFixed(2),r.uf==='RJ'||r.uf==='SP'?'—':POST_COST.toFixed(2),r.uf==='SP'?'Absorvido':r.cost.toFixed(2)])];name='BRMobility_postos_regionais.csv'}else if(page==='fase1'){rows=[['Responsável','Estados','Modelo de custo','Valor','UF do posto','Posto','Veículos'],...phase1Rows.flatMap(r=>r.posts.map(p=>[r.name,r.ufs.join('/'),r.costType,r.cost,p.uf,p.name,p.vehicles]))];name='BRMobility_regionais_fase1.csv'}else if(page==='disponibilidade'){rows=[['Tipo','Região ou modelo','Frota ativa','Stand By / reserva','Em breve / remanejar','Destino ou padrão'],...managedRows.map(r=>['Inventário',r.model,r.active,r.immediate,r.soon,(STOCK_DESTINATIONS[r.model]?.immediate||'—')+' | '+(STOCK_DESTINATIONS[r.model]?.soon||'—')]),...REGION_STRATEGY.map(r=>['Estratégia regional',r.region,regionTotals[r.region],r.reserve,r.move,r.standard])];name='BRMobility_disponibilidade_redistribuicao.csv'}else{rows=[['Tipo','Categoria','Quantidade','% Frota'],...modelRows.map(r=>['Modelo',r.model,r.total,(r.pct*100).toFixed(2)]),...familyRows.map(r=>['Família',r.family,r.total,(r.total/TOTAL*100).toFixed(2)])];name='BRMobility_modelos_familias.csv'}const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');({modelos:renderModelos,regional:renderPostosRegional,disponibilidade:renderFamiliasRegionais,fase1:renderFase1}[b.dataset.page]||renderModelos)();window.scrollTo(0,0)});
renderPostosRegional();
</script>
